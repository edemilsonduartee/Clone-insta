<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="script.js" defer></script>
    <title>Instagram</title>
</head>

<body>

    <div class="container-imagens">
        <img class="celular" src="./img/celular.png">
        <img src="./img/insta1.png" class="imagem-celular">
        <img src="./img/insta2.png" class="imagem-celular" id="troca-imagem">
    </div>
    <div class="container-itens">
        <div class="container-form">
            <img src="./img/insta-logo.png">

            <input placeholder="Telefone, Nome de usuario ou Email">
            <input placeholder="Senha">
            <p class="ou">ou</p>
            <button>Entrar</button>

            <a href="https://www.facebook.com/" class="facebook">Entrar com o Facebook</a>
            <a href="https://www.instagram.com/accounts/password/reset/" class="esqueceu-senha">Esqueceu a senha?</a>
        </div>
        <div class="container-cadastro">
            <p class="container-conta">Não tem uma conta? </p>
            <a class="link-cadastro"> Cadastre-se</a>
        </div>
        <p class="aplicativo"> Obtenha o aplicativo</p>
        <div class="container-app">
            <img src="./img/ios.png" class="logo-app">
            <img src="./img/google.png" class="logo-app">
        </div>
    </div>

</body>

</html>
